apply plugin: 'java-library'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    testImplementation project(':desktop')
    testImplementation project(':headless-desktop')
    testImplementation project(':client-simulator')
    testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testImplementation "org.json:json:20170516"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform {
        excludeTags 'desktop'
    }
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)

tasks.register('desktopSmokeTest', Test) {
    group = 'verification'
    description = 'Runs desktop smoke tests that open a game window.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*Smoke.class'
    forkEvery = 1
    useJUnitPlatform {
        includeTags 'desktop'
    }
    if (osName.contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}
